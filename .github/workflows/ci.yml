name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify pinned Go toolchain
        run: test "$(go env GOVERSION)" = "go1.25.12"
      - name: Run unit tests with race detector
        run: go test -race ./...

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CHAPTARR_IMAGE: chaptarr/chaptarr:0.9.925@sha256:8e29f4941acaf74c80bba4322237dfd2549816b3dd1b581f176b1be5d1ccb46b
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.2
          tofu_wrapper: false
      - name: Verify contract and generated content
        run: |
          test "$(go env GOVERSION)" = "go1.25.12"
          go mod verify
          go run ./tools/openapi check
          go run ./tools/compatibility check
          docker compose -f acceptance/compose.yaml config --quiet
          bash ./scripts/test-plan-leak.sh
          bash ./scripts/test-release-assets.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.2
          tofu_wrapper: false
      - name: Run formatting and vet checks
        shell: bash
        run: |
          test "$(go env GOVERSION)" = "go1.25.12"
          test -z "$(gofmt -l main.go internal tools)"
          go vet ./...
          tofu fmt -check -recursive examples acceptance
          git diff --check
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0

  acceptance:
    name: Acceptance (${{ matrix.chaptarr-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - chaptarr-version: "0.9.925"
            image: chaptarr/chaptarr:0.9.925@sha256:8e29f4941acaf74c80bba4322237dfd2549816b3dd1b581f176b1be5d1ccb46b
          - chaptarr-version: "0.9.914"
            image: chaptarr/chaptarr:0.9.914@sha256:4780b36440dc055a404f86da089f124d41e3330d32eeb92837f65fb5c82a348c
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.2
          tofu_wrapper: false
      - name: Verify disposable Chaptarr lifecycle
        env:
          CHAPTARR_IMAGE: ${{ matrix.image }}
          CHAPTARR_VERSION: ${{ matrix.chaptarr-version }}
        run: bash ./scripts/test-acceptance.sh

  quality:
    name: Quality
    if: always()
    needs:
      - unit
      - contract
      - lint
      - acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every quality tier to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          test "${UNIT_RESULT}" = success
          test "${CONTRACT_RESULT}" = success
          test "${LINT_RESULT}" = success
          test "${ACCEPTANCE_RESULT}" = success

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan committed content for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose --log-opts=--all

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: |
          test "$(go env GOVERSION)" = "go1.25.12"
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  release-snapshot:
    name: Release Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build provider release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=sign --parallelism=2
      - name: Verify registry artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/terraform-provider-chaptarr_linux_amd64_v1/terraform-provider-chaptarr_v0.0.0-SNAPSHOT-* || \
            find dist -type f -name 'terraform-provider-chaptarr_v*' -print -quit | grep -q .
          checksum_file="$(find dist -maxdepth 1 -type f -name 'terraform-provider-chaptarr_*_SHA256SUMS' -print -quit)"
          test -n "${checksum_file}"
          manifest_line="$(grep -E ' terraform-provider-chaptarr_.+_manifest\.json$' "${checksum_file}")"
          test "$(printf '%s\n' "${manifest_line}" | wc -l)" -eq 1
          read -r manifest_digest _ <<< "${manifest_line}"
          expected_manifest_digest="$(sha256sum terraform-registry-manifest.json | awk '{print $1}')"
          test "${manifest_digest}" = "${expected_manifest_digest}"
          python3 - <<'PY'
          import json
          with open("terraform-registry-manifest.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          assert manifest == {"version": 1, "metadata": {"protocol_versions": ["6.0"]}}
          PY

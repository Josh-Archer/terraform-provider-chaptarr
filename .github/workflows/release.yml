name: Release
run-name: ${{ inputs.release_tag != '' && format('Release {0}', inputs.release_tag) || 'Automated SemVer Release' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Explicit SemVer tag override (e.g. v0.2.0)
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    name: Signed Release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out default branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Calculate next SemVer tag
        id: semver
        shell: bash
        run: |
          bash ./scripts/calculate-next-version.sh "${{ inputs.release_tag }}"

      - name: Create and push git tag
        if: steps.semver.outputs.should_release == 'true'
        shell: bash
        env:
          NEXT_TAG: ${{ steps.semver.outputs.next_tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${NEXT_TAG}" >/dev/null 2>&1; then
            echo "Tag ${NEXT_TAG} already exists locally."
          else
            echo "Tagging commit with ${NEXT_TAG}..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${NEXT_TAG}" -m "Release ${NEXT_TAG}"
            git push origin "${NEXT_TAG}"
          fi
          echo "RELEASE_TAG=${NEXT_TAG}" >> "${GITHUB_ENV}"

      - name: Require release environment signing configuration
        if: steps.semver.outputs.should_release == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY_CONFIGURED: ${{ secrets.GPG_PRIVATE_KEY != '' }}
          PASSPHRASE_CONFIGURED: ${{ secrets.PASSPHRASE != '' }}
        run: |
          set -euo pipefail
          if [[ "${GPG_PRIVATE_KEY_CONFIGURED}" != "true" || "${PASSPHRASE_CONFIGURED}" != "true" ]]; then
            echo "Signed release prerequisites are not configured in the release environment." >&2
            exit 1
          fi

      - name: Import release signing key
        if: steps.semver.outputs.should_release == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Set up Go
        if: steps.semver.outputs.should_release == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Publish signed provider release
        if: steps.semver.outputs.should_release == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --parallelism=2 --config .goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

name: OpenAPI Drift

on:
  schedule:
    - cron: "43 6 * * 3"
  workflow_dispatch:
    inputs:
      ref:
        description: Optional upstream release tag to compare
        required: false
        type: string

concurrency:
  group: openapi-drift
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  drift:
    name: Upstream OpenAPI Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRIFT_REPORT: openapi-drift.json
      UPSTREAM_REF: ${{ inputs.ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare pinned contract with upstream release
        run: go run ./tools/openapi drift "${UPSTREAM_REF}" > "${DRIFT_REPORT}"
      - name: Upsert OpenAPI drift issue
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- openapi-drift -->'
          title='OpenAPI drift against upstream release'
          issues="$(gh issue list --state all --limit 100 --json number,state,body)"
          matches="$(jq -c --arg marker "${marker}" '[.[] | select((.body // "") | contains($marker))]' <<<"${issues}")"
          open_numbers="$(jq -r '.[] | select(.state == "OPEN") | .number' <<<"${matches}")"
          issue_number="$(jq -r '[.[] | select(.state == "OPEN")][0].number // empty' <<<"${matches}")"

          if jq -e '.drift' "${DRIFT_REPORT}" >/dev/null; then
            body="$(jq -r '
              "<!-- openapi-drift -->\n## Upstream release `" + .tag + "` differs from the pinned OpenAPI contract.\n\nSource: " + .url + "\n\n| Operation | Change | Classification | Pinned fingerprint | Release fingerprint |\n|---|---|---|---|---|\n" +
              ([.changes[] | "| `" + .key + "` | " + .kind + " | " + .classification + " | `" + ((.pinned_fingerprint // "—")[0:12]) + "` | `" + ((.upstream_fingerprint // "—")[0:12]) + "` |"] | join("\n")) +
              "\n\nReview the upstream contract and classifications before updating the pin."
            ' "${DRIFT_REPORT}")"
            if [[ -z "${issue_number}" ]]; then
              issue_number="$(jq -r '[.[] | select(.state == "CLOSED")][0].number // empty' <<<"${matches}")"
              if [[ -n "${issue_number}" ]]; then
                gh issue reopen "${issue_number}" --repo "${GH_REPO}"
              else
                gh issue create --repo "${GH_REPO}" --title "${title}" --body "${body}"
              fi
            fi
            if [[ -n "${issue_number}" ]]; then
              gh issue edit "${issue_number}" --repo "${GH_REPO}" --title "${title}" --body "${body}"
            fi
          else
            while IFS= read -r number; do
              [[ -z "${number}" ]] || gh issue close "${number}" --repo "${GH_REPO}" --comment 'The pinned OpenAPI contract matches this upstream release.'
            done <<<"${open_numbers}"
            open_numbers=''
          fi

          kept="${issue_number}"
          while IFS= read -r number; do
            [[ -z "${number}" || "${number}" == "${kept}" ]] || gh issue close "${number}" --repo "${GH_REPO}" --comment 'Consolidating OpenAPI drift into the single tracking issue.'
          done <<<"${open_numbers}"
